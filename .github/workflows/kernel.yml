name: Ubuntu 26.10 SL7 kernel

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this Ubuntu version and recipe already have a candidate
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['ci/**', 'patches/**', 'tests/**', '.github/workflows/kernel.yml']

permissions:
  contents: read

concurrency:
  group: ubuntu-stonking-kernel
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: ubuntu:26.10@sha256:73b76549166d2d32444ccbd2b79b34381a1b3e25fd150cdd7fb12383fe7ebdc2
    outputs:
      build: ${{ steps.resolve.outputs.build }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash ci/apt-setup.sh
      - id: resolve
        env:
          MODULE_CERT_PEM: ${{ vars.MODULE_CERT_PEM }}
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force }}
        run: python3 ci/resolve.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-input
          path: work/input.json
          retention-days: 7

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-input
          path: work
      - name: Make room on the disposable runner
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .
      - name: Build in Ubuntu 26.10 ARM64
        env:
          MODULE_CERT_PEM: ${{ vars.MODULE_CERT_PEM }}
        run: |
          docker run --rm --platform linux/arm64 \
            -e MODULE_CERT_PEM \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=3G \
            -e CCACHE_COMPILERCHECK=content \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            ubuntu:26.10@sha256:73b76549166d2d32444ccbd2b79b34381a1b3e25fd150cdd7fb12383fe7ebdc2 \
            bash -c 'bash ci/apt-setup.sh && python3 ci/build.py'
      - name: Upload unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-kernel
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics
          include-hidden-files: true
          path: |
            work/input.json
            work/logs/
            work/output/.config
          retention-days: 14
          if-no-files-found: warn

  sign:
    needs: [resolve, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: secure-boot-signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-kernel
          path: unsigned-download
      - name: Prepare trusted signing tools before exposing Secrets
        run: docker build -f ci/Signing.Dockerfile -t sl7-signing-tools .
      - name: Sign modules and both EFI layers without network access
        env:
          SL7_MODULE_KEY_PEM: ${{ secrets.SL7_MODULE_KEY_PEM }}
          SL7_MODULE_CERT_PEM: ${{ secrets.SL7_MODULE_CERT_PEM }}
          SL7_BOOT_KEY_PEM: ${{ secrets.SL7_BOOT_KEY_PEM }}
          SL7_BOOT_CERT_PEM: ${{ secrets.SL7_BOOT_CERT_PEM }}
        run: |
          mkdir -p signed-output
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,size=512m \
            -e SL7_MODULE_KEY_PEM -e SL7_MODULE_CERT_PEM -e SL7_BOOT_KEY_PEM -e SL7_BOOT_CERT_PEM \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$GITHUB_WORKSPACE/unsigned-download:/input:ro" \
            -v "$GITHUB_WORKSPACE/signed-output:/out" -w /workspace \
            sl7-signing-tools python3 ci/sign-ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-kernel
          path: signed-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  validate-packages:
    needs: sign
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-kernel
          path: signed-output
      - name: Test signed packages with dpkg, dracut and GRUB
        run: |
          docker build -f tests/Packaging.Dockerfile -t sl7-package-check .
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" sl7-package-check \
            python3 tests/install-smoke.py --packages /workspace/signed-output

  publish:
    needs: [resolve, sign, validate-packages]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-kernel
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-kernel
          path: dist
      - name: Publish a candidate, never an installed kernel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          KERNEL_RELEASE: ${{ needs.resolve.outputs.release }}
        run: |
          cat > notes.md <<'EOF'
          Ubuntu 26.10 ARM64 + Romulus13 Wi-Fi / touchpad / SPI touchscreen / power patches.

          **Signed build candidate; not hardware-validated.** The linux-image deb contains signed modules and an EFI image with the Romulus13 device tree. Review SIGNING.json and BUILD.json. Signing keys are supplied only to the main-branch environment signing job and are excluded from artifacts. No firmware, machine calibration or personal network settings are included.

          Install the matching linux-sl7, linux-sl7-support and linux-image debs through APT. Ubuntu kernel hooks generate initrd and update the existing GRUB2 menu automatically. Keep the currently working kernel and Secure Boot enabled. APT subscribers receive candidates at https://mirrors.5cena.cc/; stable promotion requires hardware validation. See README.zh-CN.md for certificate enrollment and setup. The unsigned bundle remains available for independent signing and reproducibility.
          EOF
          (cd dist && sha256sum -c SHA256SUMS && sha256sum -c SIGNING-SHA256SUMS)
          (cd dist && sha256sum *.deb *.tar.zst BUILD.json SIGNING.json > RELEASE-SHA256SUMS)
          gh release create "$RELEASE_TAG" dist/* --repo "$GH_REPO" \
            --target "$GITHUB_SHA" --draft --prerelease --title "$KERNEL_RELEASE (signed candidate)" --notes-file notes.md
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --prerelease

  notify:
    needs: [resolve, build, sign, validate-packages, publish]
    if: ${{ always() && (failure() || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Notify failures or close a recovered failure
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.publish.result }}
          JOB_RESULTS: resolve=${{ needs.resolve.result }}, build=${{ needs.build.result }}, sign=${{ needs.sign.result }}, validate-packages=${{ needs.validate-packages.result }}, publish=${{ needs.publish.result }}
        run: python3 ci/notify.py
