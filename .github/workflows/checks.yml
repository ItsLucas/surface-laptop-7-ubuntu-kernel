name: Pipeline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n ci/apt-setup.sh
      - name: Exercise dpkg, dracut and GRUB in a disposable Ubuntu container
        run: |
          docker build -f tests/Packaging.Dockerfile -t sl7-package-check .
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace:ro" sl7-package-check
