server {
    listen 80;
    listen [::]:80;
    server_name mirrors.5cena.cc;
    root /srv/sl7-apt/public;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mirrors.5cena.cc;
    ssl_certificate /etc/letsencrypt/live/mirrors.5cena.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mirrors.5cena.cc/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/sl7-apt/public;
    autoindex on;
    location / { try_files $uri $uri/ =404; }
    location ~ /(?:pool/|by-hash/) {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
}
