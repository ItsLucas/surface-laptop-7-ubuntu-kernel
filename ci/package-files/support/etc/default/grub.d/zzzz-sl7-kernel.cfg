# Migrate only the two historical SL7 fixed defaults. Other administrator
# choices, including GRUB_DEFAULT=saved, continue to work normally.
case "${GRUB_DEFAULT:-}" in
    sl7-combined-kernel|sl7-spi-touchscreen-test) GRUB_DEFAULT=0 ;;
esac

# Explicit opt-in: keep Ubuntu's standard menu, but point its first entry at
# the newest complete SL7 image/initrd pair rather than a newer stock kernel.
sl7_latest_complete_kernel() {
    for sl7_image in "$1"/vmlinuz-*-sl7.*; do
        [ -s "$sl7_image" ] || continue
        sl7_release=${sl7_image##*/vmlinuz-}
        printf '%s\n' "$sl7_release" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-sl7\.[0-9]+\.[0-9]+$' || continue
        [ -s "$1/initrd.img-$sl7_release" ] || continue
        printf '%s\n' "$sl7_image"
    done | LC_ALL=C sort -V | tail -n 1
}

if [ "${SL7_FOLLOW_APT:-0}" = 1 ]; then
    sl7_latest=$(sl7_latest_complete_kernel /boot)
    if [ -n "$sl7_latest" ]; then
        GRUB_TOP_LEVEL=$sl7_latest
        GRUB_DEFAULT=0
    fi
    unset sl7_latest
fi
