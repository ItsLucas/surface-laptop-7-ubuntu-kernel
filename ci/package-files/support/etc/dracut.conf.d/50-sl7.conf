# dracut has selected the target kernel before sourcing this file.
# Do not request our out-of-tree modules when rebuilding an Ubuntu kernel.
case "${kernel:-}" in
    *-sl7.*)
        add_drivers+=" spi_hid spi_geni_qcom gpi "
        hostonly_cmdline=no
        do_strip=no
        # Preserve the existing machine-local board override, when present.
        install_optional_items+=" /usr/lib/firmware/updates/ath12k/WCN7850/hw2.0/board-2.bin "
        ;;
esac
